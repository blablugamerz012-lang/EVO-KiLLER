<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY GUN LiFE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#050713}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 75% 30%,#5b4cff44,transparent 30%),radial-gradient(circle at 20% 80%,#00bfff25,transparent 30%),linear-gradient(135deg,#050713,#0c1230 55%,#03040a)}
.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:55px 55px;transform:perspective(500px) rotateX(60deg) scale(1.5);transform-origin:center bottom}
.menu{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.box{width:min(760px,100%);padding:55px 30px;text-align:center;border:1px solid #ffffff18;border-radius:30px;background:#080c1dcc;backdrop-filter:blur(15px);box-shadow:0 30px 100px #0008}
.small{font-size:12px;letter-spacing:5px;color:#9188ff;font-weight:900;margin-bottom:18px}
h1{font-size:clamp(55px,10vw,100px);line-height:.85;letter-spacing:-5px}
h1 span{color:#796aff;text-shadow:0 0 35px #6658ff66}
.sub{margin:22px 0 35px;color:#9da8c4;letter-spacing:2px}
.buttons{width:min(340px,100%);margin:auto;display:grid;gap:13px}
button{height:56px;border:0;border-radius:13px;color:#fff;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;transition:.2s}
.play{background:linear-gradient(135deg,#7565ff,#4938d8);box-shadow:0 12px 35px #5b4cff44}
.play:hover{transform:translateY(-3px);box-shadow:0 18px 45px #5b4cff66}
.secondary{background:#151b31;border:1px solid #293451}
.secondary:hover{background:#202944;transform:translateY(-2px)}
#game{display:none;position:fixed;inset:0;z-index:10;background:#000}
#game iframe{width:100%;height:100%;border:0}
.back{position:fixed;top:15px;left:15px;z-index:20;width:auto;padding:0 18px;background:#11182acc;border:1px solid #ffffff22}
#settings{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:#000b;padding:20px}
.settingsBox{background:#0d1325;border:1px solid #293452;border-radius:20px;padding:30px;text-align:center;width:min(400px,100%)}
.close{margin-top:20px}
.version{margin-top:28px;color:#53617d;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div></div>

<main class="menu" id="menu">
  <section class="box">
    <div class="small">EVO GAMES PRESENTS</div>
    <h1>MY <span>GUN</span><br>LiFE</h1>
    <p class="sub">ENTER THE GAME • START YOUR JOURNEY</p>
    <div class="buttons">
      <button class="play" onclick="playGame()">▶ PLAY</button>
      <button class="secondary" onclick="skin()">👤 SKIN</button>
      <button class="secondary" onclick="settings()">⚙ SETTINGS</button>
    </div>
    <div class="version">MY GUN LiFE • v1.0</div>
  </section>
</main>

<section id="game">
  <button class="back" onclick="home()">← HOME</button>
  <iframe id="gameFrame" src=""></iframe>
</section>

<section id="settings">
  <div class="settingsBox">
    <h2>⚙ SETTINGS</h2>
    <p style="margin-top:12px;color:#8995b0">MY GUN LiFE</p>
    <button class="secondary close" onclick="closeSettings()">CLOSE</button>
  </div>
</section>

<script>
function playGame(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("gameFrame").src="games/my-gun-life/index.html";
}
function home(){
  document.getElementById("gameFrame").src="";
  document.getElementById("game").style.display="none";
  document.getElementById("menu").style.display="flex";
}
function skin(){alert("SKIN menu coming soon!")}
function settings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
document.addEventListener("keydown",e=>{if(e.key==="Escape" && document.getElementById("game").style.display==="block")home()})
</script>
</body>
</html>
